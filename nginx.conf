server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evita redirecciones absolutas (perderían el puerto tras el proxy)
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml;

    # Assets con hash de contenido: cache inmutable y larga
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Media sin hash: cache larga
    location ~* \.(?:avif|webp|jpe?g|png|svg|woff2|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML: try_files con 404 propia
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
